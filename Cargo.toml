[package]
name = "era-engine"
version = "0.2.0-alpha.1"
edition = "2021"
description = "Independent experimental interpreter for ERA-style emission calculation methods"
publish = false

[features]
recovered-tests = []

[[test]]
name = "recovered"
required-features = ["recovered-tests"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1
