name: Rust
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install optional analysis dependencies
        run: |
          python3 -m venv .research-venv
          .research-venv/bin/pip install --disable-pip-version-check -r tools/requirements-research.txt
      - name: Install pinned Rust for native observer parity tests
        run: rustup toolchain install 1.90.0 --profile minimal
      - name: Test tracing on synthetic PE images only
        env:
          RUSTUP_TOOLCHAIN: 1.90.0
        run: .research-venv/bin/python -m unittest discover -s tools -p 'test_*.py' -v
      - name: Test native API observer with synthetic JavaScript runtime
        run: node tools/test_native_api_observer.js
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.90.0 fmt --check
      - run: cargo +1.90.0 clippy --locked --all-targets -- -D warnings
      - run: cargo +1.90.0 test --locked
      - name: Test offline native metadata correlation
        run: cargo +1.90.0 test --locked --example native_trace_report
      - name: Test saved archive source parameter comparisons
        run: cargo +1.90.0 test --locked --example archive_source_compare
      - name: Test paired field replay without original projects
        run: cargo +1.90.0 test --locked --example field_replay
      - run: cargo +1.90.0 run --locked -- demo
      - name: Build Windows x64 release
        if: matrix.os == 'windows-latest'
        run: cargo +1.90.0 build --release --locked --target x86_64-pc-windows-msvc
      - name: Package and smoke-test Windows executable
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./scripts/package-windows.ps1
      # Development builds are checked on the runner only, never uploaded.
      # Public executables require the full-release readiness review.
