name: Rust
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.90.0 fmt --check
      - run: cargo +1.90.0 clippy --locked --all-targets -- -D warnings
      - run: cargo +1.90.0 test --locked
      - run: cargo +1.90.0 run --locked -- demo
      - name: Build Windows x64 release
        if: matrix.os == 'windows-latest'
        run: cargo +1.90.0 build --release --locked --target x86_64-pc-windows-msvc
      - name: Package and smoke-test Windows executable
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./scripts/package-windows.ps1
      # Development builds are checked on the runner only, never uploaded.
      # Public executables require the full-release readiness review.
